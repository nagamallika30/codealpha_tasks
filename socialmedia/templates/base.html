<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SocialApp{% endblock %}</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #667085;
            --line: #d9e2ec;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --brand: #1f6feb;
            --brand-dark: #174ea6;
            --accent: #14b8a6;
            --danger: #c2410c;
            --shadow: 0 18px 45px rgba(23, 32, 51, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                linear-gradient(180deg, #eef6ff 0%, #f7fafc 36%, #f6f7fb 100%);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .navbar {
            align-items: center;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid rgba(217, 226, 236, 0.9);
            display: flex;
            gap: 18px;
            justify-content: space-between;
            padding: 14px 30px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            align-items: center;
            display: inline-flex;
            font-size: 22px;
            font-weight: 900;
            gap: 10px;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .brand-mark {
            align-items: center;
            background: var(--brand);
            border-radius: 8px;
            color: #ffffff;
            display: inline-flex;
            height: 34px;
            justify-content: center;
            width: 34px;
        }

        .nav-search {
            flex: 1;
            max-width: 420px;
        }

        .nav-search form {
            align-items: center;
            display: flex;
            gap: 8px;
        }

        .nav-actions {
            align-items: center;
            display: flex;
            gap: 10px;
        }

        .nav-user {
            color: var(--muted);
            font-size: 14px;
            white-space: nowrap;
        }

        .page {
            margin: 0 auto;
            max-width: 1180px;
            padding: 28px 18px 54px;
            width: 100%;
        }

        .feed-shell {
            align-items: start;
            display: grid;
            gap: 22px;
            grid-template-columns: minmax(0, 1fr) 320px;
        }

        .auth-page {
            align-items: center;
            display: flex;
            min-height: calc(100vh - 65px);
            padding: 24px 16px;
        }

        .auth-card,
        .card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(217, 226, 236, 0.95);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .auth-card {
            margin: 0 auto;
            max-width: 430px;
            padding: 30px;
            width: 100%;
        }

        .card {
            padding: 22px;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .cluster {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .button,
        button {
            align-items: center;
            background: var(--ink);
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            display: inline-flex;
            font-size: 14px;
            font-weight: 800;
            justify-content: center;
            line-height: 1;
            min-height: 42px;
            padding: 12px 16px;
            transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
        }

        .button:hover,
        button:hover {
            box-shadow: 0 10px 24px rgba(23, 32, 51, 0.14);
            transform: translateY(-1px);
        }

        .button.primary,
        button.primary {
            background: var(--brand);
        }

        .button.primary:hover,
        button.primary:hover {
            background: var(--brand-dark);
        }

        .button.secondary,
        button.secondary {
            background: #e8eef6;
            color: var(--ink);
        }

        .button.ghost,
        button.ghost {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--ink);
        }

        .button.danger,
        button.danger {
            background: var(--danger);
        }

        input,
        textarea {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: var(--ink);
            font: inherit;
            outline: none;
            padding: 13px 14px;
            transition: border 0.16s ease, box-shadow 0.16s ease;
            width: 100%;
        }

        input:focus,
        textarea:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(31, 111, 235, 0.12);
        }

        textarea {
            min-height: 112px;
            resize: vertical;
        }

        label {
            color: #334155;
            display: block;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .muted {
            color: var(--muted);
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            color: #7c2d12;
            padding: 12px 14px;
        }

        .message.success {
            background: #ecfdf3;
            border-color: #bbf7d0;
            color: #166534;
        }

        .avatar {
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 7px 16px rgba(23, 32, 51, 0.12);
            object-fit: cover;
        }

        @media (max-width: 900px) {
            .feed-shell {
                grid-template-columns: 1fr;
            }

            .nav-search {
                max-width: none;
                order: 3;
                width: 100%;
            }

            .navbar {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 640px) {
            .navbar {
                align-items: stretch;
                padding: 14px 16px;
            }

            .nav-actions,
            .nav-actions form,
            .nav-actions .button,
            .nav-actions button {
                width: 100%;
            }

            .nav-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .page {
                padding-left: 12px;
                padding-right: 12px;
            }
        }
    </style>
    {% block styles %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'home' %}">
            <span class="brand-mark">S</span>
            <span>SocialApp</span>
        </a>

        {% if request.user.is_authenticated %}
            <div class="nav-search">
                <form method="GET" action="{% url 'search_users' %}">
                    <input type="search" name="q" placeholder="Search people" value="{{ query|default:'' }}">
                    <button class="primary" type="submit">Search</button>
                </form>
            </div>
        {% endif %}

        <div class="nav-actions">
            {% if request.user.is_authenticated %}
                <span class="nav-user">Hi, <strong>{{ request.user.username }}</strong></span>
                <a class="button secondary" href="{% url 'profile' request.user.username %}">Profile</a>
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="danger" type="submit">Logout</button>
                </form>
            {% else %}
                <a class="button secondary" href="{% url 'login' %}">Login</a>
                <a class="button primary" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    {% block body %}{% endblock %}
</body>
</html>
