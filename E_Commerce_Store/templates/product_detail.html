<!DOCTYPE html>
<html>

<head>
    <title>{{ product.name }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: linear-gradient(180deg, #f8fafc, #eef2f7);
    color: #111827;
}

/* NAV */
.nav {
    display: flex;
    gap: 25px;
    padding: 16px 50px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.nav a {
    text-decoration: none;
    color: #111827;
    font-weight: 600;
    transition: 0.3s;
}

.nav a:hover {
    color: #2563eb;
    transform: translateY(-1px);
}

/* CONTAINER */
.container {
    max-width: 1150px;
    margin: 40px auto;
    padding: 0 20px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 50px;
    align-items: start;
}

/* IMAGE CARD */
.image {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    transition: 0.4s ease;
    overflow: hidden;
}

.image img {
    width: 100%;
    border-radius: 16px;
    transition: 0.4s ease;
}

.image:hover img {
    transform: scale(1.08);
}

/* PRODUCT INFO */
.name {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.price {
    margin-top: 12px;
    font-size: 26px;
    font-weight: 800;
    color: #16a34a;
}

/* DESCRIPTION */
.desc {
    margin-top: 18px;
    color: #6b7280;
    line-height: 1.7;
    font-size: 15px;
}

/* ACTION BOX */
.box {
    margin-top: 25px;
    padding: 18px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
}

/* BUTTONS */
.btn {
    display: block;
    text-align: center;
    padding: 14px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 700;
    margin-top: 12px;
    transition: 0.3s ease;
    position: relative;
    overflow: hidden;
}

/* hover animation */
.btn::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    left: -100%;
    top: 0;
    background: rgba(255,255,255,0.2);
    transition: 0.4s;
}

.btn:hover::after {
    left: 0;
}

.btn:hover {
    transform: translateY(-3px);
}

.cart {
    background: linear-gradient(135deg, #f59e0b, #f97316);
    color: white;
    box-shadow: 0 10px 25px rgba(245,158,11,0.3);
}

.buy {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
    box-shadow: 0 10px 25px rgba(239,68,68,0.3);
}

/* REVIEWS SECTION */
.reviews {
    margin-top: 40px;
    padding: 25px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}

.reviews h3 {
    font-size: 20px;
    margin-bottom: 15px;
}

/* REVIEW CARD */
.review {
    padding: 15px;
    border-radius: 12px;
    background: #f9fafb;
    margin-bottom: 12px;
    transition: 0.3s;
}

.review:hover {
    transform: translateX(5px);
    background: #eef2ff;
}

/* FORM */
textarea, select {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    outline: none;
    transition: 0.3s;
}

textarea:focus, select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
}

button {
    margin-top: 12px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #111827, #1f2937);
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    background: #000;
}

/* ANIMATION */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.grid, .reviews {
    animation: fadeUp 0.6s ease;
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .nav {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div class="nav">
    <a href="/">Home</a>
    <a href="{% url 'cart_page' %}">Cart</a>
    <a href="/orders/my-orders/">Orders</a>
</div>

<div class="container">

    <div class="grid">

        <div class="image">
            <img src="{{ product.image }}">
        </div>

        <div>
            <div class="name">{{ product.name }}</div>
            <div class="price">₹{{ product.price }}</div>

            <div class="desc">{{ product.description }}</div>

            <div class="box">
                <a class="btn cart" href="{% url 'add_to_cart' product.id %}">Add to Cart</a>
                <a class="btn buy" href="{% url 'buy_now' product.id %}">Buy Now</a>
            </div>
        </div>

    </div>

    <div class="reviews">

        <h3>Customer Reviews</h3>

        {% for review in product.review_set.all %}
            <div class="review">
                <b>{{ review.user.username }}</b>
                <p>⭐ {{ review.rating }}/5</p>
                <p>{{ review.comment }}</p>
            </div>
        {% empty %}
            <p>No reviews yet.</p>
        {% endfor %}

        <form method="POST" action="{% url 'add_review' product.id %}">
            {% csrf_token %}
            <select name="rating">
                <option>5</option>
                <option>4</option>
                <option>3</option>
                <option>2</option>
                <option>1</option>
            </select>

            <textarea name="comment" placeholder="Write review..."></textarea>

            <button type="submit">Submit</button>
        </form>

    </div>

</div>

</body>
</html>
