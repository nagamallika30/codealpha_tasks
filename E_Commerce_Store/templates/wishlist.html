<!DOCTYPE html>
<html>

<head>
    <title>Wishlist</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: linear-gradient(180deg, #f8fafc, #eef2f7);
    color: #111827;
}

/* NAVBAR */
.navbar {
    display: flex;
    gap: 20px;
    padding: 16px 40px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar a {
    text-decoration: none;
    color: #111827;
    font-weight: 600;
    transition: 0.3s;
}

.navbar a:hover {
    color: #ef4444;
    transform: translateY(-2px);
}

/* CONTAINER */
.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
}

/* TITLE */
h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 25px;
    animation: fadeDown 0.5s ease;
}

/* CARD */
.card {
    background: white;
    padding: 18px;
    margin-bottom: 18px;
    border-radius: 18px;
    display: flex;
    gap: 20px;
    align-items: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    transition: 0.35s ease;
    animation: fadeUp 0.5s ease;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 35px rgba(0,0,0,0.12);
}

/* IMAGE */
.card img {
    width: 130px;
    height: 130px;
    object-fit: contain;
    background: #f9fafb;
    border-radius: 14px;
    padding: 10px;
    transition: 0.3s;
}

.card:hover img {
    transform: scale(1.05);
}

/* PRODUCT NAME */
.card h3 {
    font-size: 18px;
    font-weight: 700;
}

/* PRICE */
.card p {
    margin-top: 6px;
    font-size: 16px;
    font-weight: 700;
    color: #16a34a;
}

/* BUTTON */
.btn {
    display: inline-block;
    margin-top: 10px;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
    padding: 10px 14px;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    transition: 0.3s;
    box-shadow: 0 8px 20px rgba(239,68,68,0.25);
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(239,68,68,0.35);
}

/* EMPTY STATE */
h2 {
    text-align: center;
    margin-top: 60px;
    color: #6b7280;
    animation: fadeUp 0.5s ease;
}

/* ANIMATIONS */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .card {
        flex-direction: column;
        text-align: center;
    }

    .card img {
        width: 100%;
        height: 200px;
    }
}
</style>

</head>

<body>

<div class="navbar">

    <a href="/">Home</a>
    <a href="/wishlist/">Wishlist ❤️</a>

</div>

<div class="container">

    <h1>My Wishlist ❤️</h1>

    {% for item in items %}

    <div class="card">

        <img src="{{ item.product.image }}">

        <div>

            <h3>{{ item.product.name }}</h3>

            <p>₹{{ item.product.price }}</p>

            <a class="btn"
               href="{% url 'remove_from_wishlist' item.id %}">
                Remove
            </a>

        </div>

    </div>

    {% empty %}

    <h2>Your wishlist is empty ❤️</h2>

    {% endfor %}

</div>

</body>
</html>
